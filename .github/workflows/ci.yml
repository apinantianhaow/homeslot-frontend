name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      # The app depends on the generated client in the backend repository
      # (../homeslot-backend/homeslot_client), so check out both side by side.
      - uses: actions/checkout@v4
        with:
          path: homeslot-frontend

      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/homeslot-backend
          path: homeslot-backend
          # For a private backend repository, add a token with read access:
          # token: ${{ secrets.BACKEND_REPO_TOKEN }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable

      - name: Install dependencies
        working-directory: homeslot-frontend
        run: flutter pub get

      - name: Generated code is up to date
        working-directory: homeslot-frontend
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- lib

      - name: Analyze
        working-directory: homeslot-frontend
        run: flutter analyze

      - name: Check formatting
        working-directory: homeslot-frontend
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Tests
        working-directory: homeslot-frontend
        run: flutter test
