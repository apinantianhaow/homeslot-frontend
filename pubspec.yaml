name: homeslot
description: "HomeSlot - แอปจองห้องภายในบ้าน (Flutter app)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Serverpod client generated by the backend repository (homeslot-backend).
  # For a checkout on another machine, use a git dependency instead:
  #   homeslot_client:
  #     git:
  #       url: https://github.com/<you>/homeslot-backend.git
  #       path: homeslot_client
  homeslot_client:
    path: ../homeslot-backend/homeslot_client
  serverpod_flutter: 4.0.3
  serverpod_auth_idp_flutter: 4.0.3

  # State, navigation and UI
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  table_calendar: ^3.2.1
  fl_chart: ^1.2.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.2
  image_picker: ^1.2.3
  share_plus: ^13.3.0

  # Time zones and localisation
  intl: ^0.20.2
  http: ^1.6.0
  timezone: ^0.11.1

  # Offline cache (SQLite) and preferences
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  shared_preferences: ^2.5.5

  # Push notifications (Firebase Cloud Messaging)
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  drift_dev: ">=2.30.0 <3.0.0"

dependency_overrides:
  # Same override as the Serverpod Flutter template.
  flutter_secure_storage: ^10.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/config.json
